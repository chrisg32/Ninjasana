[package]
name = "ninjasana"
version = "0.1.0"
edition = "2024"
description = "A mouse-native terminal UI for Asana, inspired by herdr."
license = "MIT"
repository = "https://github.com/chrisg32/Ninjasana"
readme = "README.md"

[dependencies]
anyhow = "1.0.102"
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
dotenvy = "0.15.7"
open = "5.3.5"
ratatui = "0.30.1"
reqwest = { version = "0.13.4", features = ["json"] }
rpassword = "7.5.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = "0.3.47"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.1.2"

# Secure credential storage, with a native backend selected per platform so
# each target only compiles the one it uses.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
